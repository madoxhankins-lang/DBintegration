name: wd2200-dbe
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbe
      POSTGRES_PASSWORD: dbe_local
      POSTGRES_DB: products
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbe -d products"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
