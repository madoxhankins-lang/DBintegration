info:
  name: Get updated product
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/products/:id"
  params:
    - name: id
      value: "{{productId}}"
      type: path
  auth: null

runtime:
  scripts:
    - type: tests
      code: |-
        test("Get updated product", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('x-cache')).to.equal('MISS');
          expect(res.getBody().stock).to.equal(8);
          expect(res.getBody().price).to.equal('39.99');
        });

settings:
  encodeUrl: true
